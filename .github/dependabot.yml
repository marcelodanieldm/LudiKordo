version: 2
updates:
  # Las dependencias de Expo se actualizan juntas con `npx expo install --fix`
  # al subir de SDK; Dependabot solo propone parches y menores del resto.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
