name: Error
description: Algo que no funciona como debería.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir la lección 1.3.1
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo, versión de Android y de la app
      placeholder: Moto G54, Android 14, LudiKordo 0.2.0 (versionCode 7)
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Detección de notas / micrófono, Suscripción, Lecciones, Interfaz, Traducciones, Otra]
