# APK de prueba para instalar a mano en un teléfono Android.
# - Release con el JavaScript incluido (no necesita Metro ni computadora).
# - Firmado con la clave de depuración de Expo: sirve para probar, no para Google Play.
# - Todo el contenido abierto (Premium de prueba): no hay compras en este APK.
# Respeta la versión de app.json: pre-release «apk-test-v<versión>-<n>», archivo
# «LudiKordo-<bajo|guitarra|criolla>-<versión>-prueba-<n>.apk», versionName «<versión>-test.<n>» y el mismo
# versionCode que el APK de versión (apk-release.yml: 0.2.0 → 200). Así se instala encima
# del APK de versión de esa misma versión, y el de la versión siguiente se instala encima.
# Instrumento (ADR 0009 y 0010): bajo por defecto; guitarra eléctrica eligiendo «guitar»
# o criolla eligiendo «nylon» al lanzarlo a mano, o con un push a cc/apk-guitar o cc/apk-nylon.
name: apk-test

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: Qué app compilar
        type: choice
        options: [bass, guitar, nylon]
        default: bass
  push:
    branches: [cc/apk-build, cc/apk-guitar, cc/apk-nylon]

concurrency:
  group: apk-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_TEST_BUILD: "1"
      EXPO_PUBLIC_DEV_PREMIUM: "1"
      EXPO_PUBLIC_INSTRUMENT: ${{ inputs.instrument || (github.ref_name == 'cc/apk-guitar' && 'guitar') || (github.ref_name == 'cc/apk-nylon' && 'nylon') || 'bass' }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Nombre del archivo según el instrumento compilado
        run: |
          case "$EXPO_PUBLIC_INSTRUMENT" in
            guitar) echo "APK_NAME=LudiKordo-guitarra" >> "$GITHUB_ENV"; echo "APK_LABEL=guitarra eléctrica" >> "$GITHUB_ENV" ;;
            nylon) echo "APK_NAME=LudiKordo-criolla" >> "$GITHUB_ENV"; echo "APK_LABEL=guitarra criolla" >> "$GITHUB_ENV" ;;
            *) echo "APK_NAME=LudiKordo-bajo" >> "$GITHUB_ENV"; echo "APK_LABEL=bajo" >> "$GITHUB_ENV" ;;
          esac
      - name: Versión (app.json)
        run: |
          v=$(node -p "require('./app.json').expo.version")
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "app.json tiene una versión inválida: $v"; exit 1; }
          IFS=. read -r major minor patch <<< "$v"
          {
            echo "APP_VERSION=$v"
            # Misma fórmula que apk-release.yml; app.config.ts la aplica en el prebuild.
            echo "APK_VERSION_CODE=$((major * 10000 + minor * 100 + patch))"
            echo "APK_VERSION_NAME=$v-test.$BUILD"
            echo "APK_FILE=$APK_NAME-$v-prueba-$BUILD.apk"
            echo "TAG=apk-test-v$v-$BUILD"
          } >> "$GITHUB_ENV"
      - name: Pruebas de lógica
        # Las pruebas corren como bajo (el contenido de guitarra se prueba aparte, en tests/guitar.test.ts).
        env:
          EXPO_PUBLIC_INSTRUMENT: bass
        run: npm test
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
      - name: El proyecto lleva la versión
        run: |
          grep -q "versionCode $APK_VERSION_CODE" android/app/build.gradle || { echo "versionCode distinto de $APK_VERSION_CODE"; exit 1; }
          grep -q "versionName \"$APK_VERSION_NAME\"" android/app/build.gradle || { echo "versionName distinto de $APK_VERSION_NAME"; exit 1; }
      - name: Módulos nativos que enlaza Expo (diagnóstico)
        run: npx expo-modules-autolinking resolve --platform android --json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const m of d.modules){console.log(m.packageName, m.packageVersion, JSON.stringify((m.projects||[]).map(p=>({name:p.name,publication:p.publication}))))}"
      - name: Compilar el APK (release, arm64)
        working-directory: android
        # La mayoría de los teléfonos de los últimos años son arm64: el APK queda más chico y compila más rápido.
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk "$APK_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ env.APP_VERSION }}-prueba-${{ env.BUILD }}
          path: ${{ env.APK_FILE }}
          retention-days: 14
      - name: Publicar como pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$APK_FILE" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "APK de prueba $APP_VERSION · build $BUILD ($APK_LABEL)" \
            --notes "Versión $APK_VERSION_NAME (versionCode $APK_VERSION_CODE). APK para probar en un teléfono Android (arm64). No es la versión de Google Play: está firmado con una clave de prueba y tiene todo el contenido abierto. Para instalarlo, abre este enlace desde el teléfono, descarga el .apk y permite instalar apps de este origen. Commit: ${{ github.sha }}"
