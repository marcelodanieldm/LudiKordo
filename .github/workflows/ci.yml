name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Traducciones (en, es, pt)
        run: npm run check:i18n
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas de lógica
        run: npm test

  agents-config:
    name: agents-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reglas, skills y subagentes válidos y sincronizados
        run: node scripts/agents/check-config.mjs
