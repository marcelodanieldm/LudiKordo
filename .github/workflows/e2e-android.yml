name: e2e-android

# Pruebas E2E con Maestro en un emulador Android.
# Se dispara con la etiqueta `test:e2e` en un PR o a mano. Tarda unos 25 minutos.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'test:e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
      # Release incluye el JavaScript dentro del APK (debug lo pediría a Metro).
      # La plantilla de Expo firma release con la clave de debug: sirve para probar, no para publicar.
      - name: Compilar APK release de prueba
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador + Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb install -r android/app/build/outputs/apk/release/app-release.apk && maestro test .maestro/ --format junit --output maestro-report.xml --test-output-dir maestro-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            maestro-output/
          retention-days: 14
